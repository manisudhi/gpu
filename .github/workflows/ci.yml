name: GPU AMR Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r amr-gpu-ml/requirements.txt pytest

      - name: Run PyTest test suite (CI Environment)
        run: |
          cd amr-gpu-ml
          # Run feature matrix and leakage tests on CI; MPS GPU hardware tests run locally on Apple Silicon
          pytest -v tests/test_features.py
